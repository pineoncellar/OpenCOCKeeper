[project]
name = "opencockeeper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.2",
    "mem0ai>=2.0.15",
    "pyyaml>=6.0.3",
]

# 可选组：检索增强（jieba 分词 / xlsx 角色卡 / pdf / docx 模组解析）与离线规则预处理。
# mem0ai 已是主依赖（RAG 记忆后端）；切勿升级为 mem0ai[extras]——extras 会拉入 fastembed，
# 触发 mem0 qdrant 默认 BM25 稀疏模型在线下载（国内网络下会卡死启动）
[project.optional-dependencies]
retrieval = [
    "jieba>=0.42.1",
    "openpyxl>=3.1.0",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
]
preprocess = [
    "beautifulsoup4>=4.15.0",
    "html2text>=2025.4.15",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
