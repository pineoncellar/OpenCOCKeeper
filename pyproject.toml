[project]
name = "opencockeeper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.2",
    "pyyaml>=6.0.3",
]

# 可选：真实 Mem0 RAG 后端（默认不安装，避免拉入重型向量库依赖）
# 启用方式：uv add --optional rag mem0ai；不启用时可用 src.memory.FakeMemory 速跑
[project.optional-dependencies]
rag = [
    "mem0ai>=0.1.0",
]
retrieval = [
    "jieba>=0.42.1",
    "openpyxl>=3.1.0",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
]
preprocess = [
    "beautifulsoup4>=4.15.0",
    "html2text>=2025.4.15",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
