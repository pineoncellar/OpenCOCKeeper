# ============================================
# OpenCOCKeeper 新架构 — 业务配置（可提交仓库）
# 敏感信息（API Key / Base URL）请放入 providers.ini
# ============================================

project:
  name: "OpenCOCKeeper"
  # 调试模式：true 时日志级别自动降为 DEBUG
  debug: true

# ------------------------------------------------------------
# 模型分级
# provider 对应 providers.ini 中的配置节名称（不区分大小写）
# ------------------------------------------------------------
model_tiers:
  fast:
    provider: "SILKFLOW"
    model_name: "deepseek-ai/DeepSeek-V3"
    temperature: 0.3
    max_tokens: 512
  standard:
    provider: "SILKFLOW"
    model_name: "deepseek-ai/DeepSeek-V3.2"
    temperature: 0.7
    max_tokens: 2048
  smart:
    provider: "SILKFLOW"
    model_name: "deepseek-ai/DeepSeek-V4-Flash"
    temperature: 0.8
    max_tokens: 4096

# ------------------------------------------------------------
# 存储目录（相对项目根，模块启动时自动创建）
# ------------------------------------------------------------
storage:
  data_dir: "data"
  modules_dir: "data/modules"       # 模组原文（PDF / Markdown）
  raw_sources_dir: "data/raw_sources"
  backups_dir: "data/backups"
  db_path: "data/app.db"            # SQLite 主库（单库多世界）

# ------------------------------------------------------------
# 模组读取检索
# 导入期 LLM 划界：一次性识别章节标题与起始锚点，产物缓存于 data/modules/.cache
# ------------------------------------------------------------
module:
  structure:
    enabled: true               # 启用导入期 LLM 划界；false 则整篇一段
    llm_tier: "fast"            # 划界用模型档位（低成本大上下文）
    chunk_chars: 8000           # 长文本分块大小（字），块间自动重叠 10% 防切到标题

# ------------------------------------------------------------
# 记忆系统
# 与 新架构.md 对应：recent_turns 滚动窗口 + RAG 长程固化
# ------------------------------------------------------------
memory:
  recent_turns_window: 20            # 近程上下文滚动轮数
  solidify_token_threshold: 2000     # 达到该 token 阈值触发后台固化（字符近似，可选触发）
  solidify_poll_interval: 60         # 固化 Worker 轮询间隔（秒）
  solidify_min_turns: 5              # 未固化轮数阈值：达标即触发固化
  solidify_min_interval: 300         # 最小固化间隔（秒）：轮数不足但久未固化时兜底触发
  solidify_batch_limit: 50           # 单次固化最大轮数（防超长世界一次塞爆 LLM 上下文）
  # RAG 语义记忆后端配置（配合 src/memory/ 模块使用，见 docs/新rag架构.md）
  rag:
    llm_tier: "standard"            # 事件提炼 / 宏观 recap 用的模型档位
    embedder_provider: "SILKFLOW"   # 嵌入提供方（须支持 /v1/embeddings 端点）
    embedder_model: "BAAI/bge-m3"   # 嵌入模型
    embedding_model_dims: 1024       # 嵌入向量维度（bge-m3 为 1024）
    vector_store: "qdrant"          # mem0ai v2 向量库（无 sqlite）；qdrant 走本地 path 模式
    collection_name: "open_coc_keeper_mem"
    # 是否向 /v1/embeddings 请求体传 dimensions 参数。
    # false（默认）：SiliconFlow 等非 matryoshka 端点会以 400/20015 拒绝该参数；
    # 仅当端点支持按维度截断（如 OpenAI text-embedding-3-small）时才设为 true。
    pass_embedding_dims: false

# ------------------------------------------------------------
# 上下文装配（Context Assembler）
# 主 Agent 初始上下文的确定性装配参数；近程对话注入轮数属软预算，
# 实际 Token 占用随对话长度浮动
# ------------------------------------------------------------
context:
  assembler:
    recent_turns: 10                # 近程对话注入轮数
  # 主 Agent（Director）：裁决模型档位与温度覆盖。
  # smart 档默认 temperature 0.8 偏高，此处压低至 0.3~0.4 提升裁决稳定性
  # （见 进度追踪.md 已知缺口）
  director:
    llm_tier: "smart"              # 裁决档位
    temperature: 0.4                # 裁决温度覆盖（None 则用模型档位默认）
  # 润色 Agent（Narrator）：演播模型档位与温度
  narrator:
    llm_tier: "standard"            # 文学表达优先档（非裁决档）
    temperature: 0.7                # 略高于裁决档，保留演播自由度
  # 开场初始化 Agent（Opening Agent）：模组大纲提炼 + 开场裁决模型档位
  opening:
    llm_tier: "smart"              # 开场裁决档（对齐 Director）
    temperature: 0.4                # 开场裁决温度覆盖（None 则用模型档位默认）

# ------------------------------------------------------------
# 适配器层
# active 选择启用的消息源适配器（当前仅 cli，未来 onebot / web 在此注册）；
# 模型档位归 context 层，本段仅承载接入层自身配置
# ------------------------------------------------------------
adapter:
  active: "cli"                   # 启用的适配器类型（当前仅 cli）
  preflight: true                  # 启动时执行 RAG 前置自检，FAIL 即中止
  check_embedding: true            # 自检是否探测 embedding 端点（离线开发可设 false）
  # CLI 适配器专属参数
  cli:
    session_id: "cli-default"     # CLI 会话标识（窗口 id 概念仅限适配器层）

# ------------------------------------------------------------
# 日志
# ------------------------------------------------------------
logging:
  dir: "logs"
  max_bytes: 10485760               # 10MB
  backup_count: 7
